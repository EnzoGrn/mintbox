# Opens pull requests when a dependency has a new version.
# Minor and patch updates are grouped per ecosystem to keep the number of pull requests low.

version: 2

updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The Maven version of the wrapper is upgraded by hand, with ./mvnw wrapper:wrapper:
      # Dependabot rewrites mvnw.cmd with Windows line endings, against .gitattributes.
      - dependency-name: org.apache.maven:apache-maven

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript follows what Next.js and typescript-eslint support, not the latest major.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # The Node.js types follow the Node.js major version of .nvmrc.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly