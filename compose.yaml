# Local development stack.
#
# Usage: docker compose up
#
# Credentials below are local defaults, not secrets. Copy .env.example to .env to override
# them. Ports are bound to 127.0.0.1 so that the services aren't reachable from the network.

name: mintbox

services:
  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mintbox}
      POSTGRES_USER: ${POSTGRES_USER:-mintbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mintbox}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for listing photos (see docs/adr/0008).
  # The API creates its buckets at startup.
  storage:
    image: chrislusf/seaweedfs:4.45
    command: >
      server
      -dir=/data
      -s3
      -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json
      -master.telemetry=false
    ports:
      - "127.0.0.1:${STORAGE_PORT:-8333}:8333"
    volumes:
      - storage-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # Catches every email sent locally. Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  postgres-data:
  storage-data:
