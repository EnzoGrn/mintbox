spring:
  application:
    name: mintbox

  # Matches the local stack started by compose.yaml. The same variables as in .env apply.
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:mintbox}
    username: ${POSTGRES_USER:mintbox}
    password: ${POSTGRES_PASSWORD:mintbox}

  mvc:
    # Errors are returned as RFC 9457 problem details (application/problem+json).
    problemdetails:
      enabled: true

  jpa:
    # Database access happens in application services, never while rendering a response.
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks at startup that the entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        # Sends inserts and updates by batches instead of one by one: the first catalog
        # import writes about 900 entries and 3,000 release dates.
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

springdoc:
  # Documents the business API only, not the actuator endpoints.
  paths-to-match: /api/**

mintbox:
  # Replaced by the Maven project version at build time (Spring Boot's resource filtering).
  version: "@project.version@"
  catalog:
    # Synchronizes the catalog with the snapshots in src/main/resources/catalog at startup.
    import-on-startup: true

management:
  endpoints:
    web:
      exposure:
        include: health
